name: frontend-build

# Validate the pinned canonical SDK owner before any native frontend build.
# Keep this fast hosted producer separate from the Python runner pool.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: frontend-build-on-ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out figrecipe
        uses: actions/checkout@v4
        with:
          path: figrecipe
      - name: Check out the pinned canonical SDK owner
        uses: actions/checkout@v4
        with:
          repository: scitex-ai/scitex-sdk
          # Reviewed consolidation API source; publication remains coordinated.
          ref: 9bf0851cbe0a5ab90b334c235fc08b7d0d4a4ebb
          path: scitex-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Assert the checkout is the declared SDK source and version
        working-directory: figrecipe/src/figrecipe/_django/frontend
        env:
          SCITEX_SDK_DIR: ${{ github.workspace }}/scitex-sdk
        run: |
          set -euo pipefail
          declared_commit="$(node -p "require('./package.json').scitexSdk.commit")"
          declared_version="$(node -p "require('./package.json').scitexSdk.version")"
          actual_commit="$(git -C "$SCITEX_SDK_DIR" rev-parse HEAD)"
          owner_version="$(node -p "require(process.env.SCITEX_SDK_DIR + '/src/scitex_sdk/package.json').version")"
          test "$actual_commit" = "$declared_commit" || { echo "::error::SDK source pin mismatch"; exit 1; }
          test "$owner_version" = "$declared_version" || { echo "::error::SDK frontend version mismatch"; exit 1; }
      - name: Install frontend deps
        working-directory: figrecipe/src/figrecipe/_django/frontend
        run: npm ci --no-audit --no-fund
      - name: Validate public exports, symbols, Python floor and lock
        working-directory: figrecipe/src/figrecipe/_django/frontend
        run: node --experimental-strip-types tests/scitexSdkContract.test.ts
      - name: Strict TypeScript and production build
        working-directory: figrecipe/src/figrecipe/_django/frontend
        run: npm run build
      - name: Strict library build
        working-directory: figrecipe/src/figrecipe/_django/frontend
        run: npm run build:lib
