name: tests

# Self-hosted (Spartan CPU) pytest matrix.
#
# SIF-based self-hosted CI (operator standardization 2026-06-18). The `tests`
# job runs INSIDE the pre-built, reused scitex-ci SIF (`apptainer exec
# ci-cpu.sif`) on the Spartan CPU runner, instead of the old bare-runner
# `actions/setup-python@v5 + pip install` steps. Those steps required a
# Python tool cache + apt (for fd) that a bare Spartan compute node does NOT
# have, so the job failed at init (steps=0) and every run sat queued forever
# behind an OFFLINE, wrong-labelled runner.
#
# The shared ci-cpu.sif bakes python 3.11/3.12/3.13 + uv + fd +
# scitex-dev[all,dev] DEPS (NOT figrecipe's own — matplotlib/seaborn/django/
# Pillow/networkx/etc.), so the job layers THIS checkout + its [all,dev]
# extras WITH dependency resolution into a writable --target dir inside the
# SIF (see .github/ci/run-in-sif.sh). fd is baked, so `audit.require-fd: true`
# (.scitex/dev/config.yaml) passes without the old apt-get fd-find step.
# fail-loud: a missing SIF/shim is a HARD error, never a bare-runner fallback.
#
# runs-on driven by repo Actions Variable CI_RUNS_ON; SIF + apptainer paths
# come from SCITEX_CI_SIF / SCITEX_CI_APPTAINER. Hosted workflows (import-smoke,
# quality-audit, rtd, publish) stay on ubuntu-latest — untouched.
#
# THE FALLBACK IS `ubuntu-latest`, DELIBERATELY, and it does not mean this job
# works there. It cannot: exec-in-sif.sh needs an apptainer and the CI SIF, and
# a hosted runner has neither — so an unset CI_RUNS_ON produces a FAST, LOUD
# failure naming exactly what was missing.
#
# That is the point. The fallback used to be `["self-hosted","Linux","X64",
# "scitex-ci"]`, a label carried ONLY by the Spartan runners. Measured
# 2026-08-15: all four of those were offline while the four scitex-*-org-cpu
# machines were up. An unset variable therefore queued the job against a label
# no online runner served — forever, with no error anywhere, because GitHub
# queues an unmatchable job rather than rejecting it.
#
# So the choice is not "fast vs slow", it is "loud failure vs silent hang", and
# a silent hang is the one failure mode nobody investigates in time. Do not
# "fix" this back to a self-hosted label: the variable is where the working
# destination belongs, and the fallback exists only for when the variable is
# absent.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

env:
  SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
  SCITEX_CI_SIF: ${{ vars.SCITEX_CI_SIF }}
  SCITEX_CI_SIF_SHA256: ${{ vars.SCITEX_CI_SIF_SHA256 }}
  RUN_E2E: "1"

jobs:
  runner-admission:
    uses: scitex-ai/.github/.github/workflows/runner-admission.yml@d7d96c34d68cdfbb5503a933591f7748b5aa30ee
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}
    permissions: {}

  test:
    needs: [runner-admission]
    # Job name kept verbatim — these are the required status checks on develop.
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    # The complete owning plotting, protocol and end-to-end suite runs under
    # xdist and coverage. Keep the existing 60-minute gate for busy runners.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - name: Require confirmed organization membership on native runners
        if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
        run: |
          echo '::error::Organization membership admission was not confirmed.'
          exit 1
      - name: Require admitted native execution for the retained CI SIF
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          NATIVE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != 'self-hosted' ] || [ "$NATIVE_AUTHORIZED" != 'true' ]; then
            echo '::error::The retained full SIF suite requires admitted native execution; no bare-runner or unqualified hosted fallback.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Require the retained whole CI image identity
        env:
          EXPECTED_SIF_SHA256: aa5836a6c317640d7e20f01eb79aa7385b3dca2f369b595065c50ba3dd34a7d5
        run: |
          set -euo pipefail
          if [ "${SCITEX_CI_SIF_SHA256:?}" != "$EXPECTED_SIF_SHA256" ]; then
            echo '::error::The CI image input differs from the retained qualified whole image; obtain owning image/runtime qualification before execution.'
            exit 1
          fi
      - name: Run tests in the reused CI SIF (apptainer exec — deps layered, not on the bare runner)
        run: bash .github/ci/exec-in-sif.sh run-in-sif.sh ${{ matrix.python-version }}
      - name: Prepare owned Codecov Git configuration and caches
        if: always() && matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          owned=$(mktemp -d "${RUNNER_TEMP:?}/figrecipe-codecov.XXXXXXXX")
          mkdir -p "$owned/cache" "$owned/config" "$owned/tmp"
          touch "$owned/gitconfig"
          for pair in "GIT_CONFIG_GLOBAL=$owned/gitconfig" "XDG_CACHE_HOME=$owned/cache" "XDG_CONFIG_HOME=$owned/config" "TMPDIR=$owned/tmp"; do
            printf '%s\n' "$pair" >> "${GITHUB_ENV:?}"
          done
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
