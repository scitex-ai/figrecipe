name: quality

# Single-package quality gate — runs `scitex-dev ecosystem audit-all`
# against this package (audit-cli / audit-mcp-tools / audit-skills /
# audit-python-apis / audit-project). Mirrors the canonical audit that
# `tests/develop/test_audit.py` runs inside the test suite, but as a
# standalone gate so an audit regression is visible even when the matrix
# is skipped.
#
# The previous body of this workflow shallow-cloned the entire ecosystem
# and ran `scripts/quality/audit_ecosystem.py` — both of which live only
# in scitex-dev, not in leaf packages. That template was copied here
# verbatim and was always broken (FileNotFoundError on a non-existent
# ecosystem registry file). This version audits just this package.

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC, after the 07:00 per-repo Test runs
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/figrecipe-quality-audit-on-ubuntu-latest.yml"
  pull_request:
    branches: [main, develop]

jobs:
  runner-admission:
    uses: scitex-ai/.github/.github/workflows/runner-admission.yml@d7d96c34d68cdfbb5503a933591f7748b5aa30ee
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}
    permissions: {}

  audit:
    needs: [runner-admission]
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    timeout-minutes: 20
    steps:
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - name: Require confirmed organization membership on native runners
        if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
        run: |
          echo '::error::Organization membership admission was not confirmed.'
          exit 1
      - name: Prepare job-owned state and caches
        run: |
          set -euo pipefail
          owned=$(mktemp -d "${RUNNER_TEMP:?}/figrecipe-context.XXXXXXXX")
          mkdir -p "$owned/tmp" "$owned/cache" "$owned/config" "$owned/scitex" "$owned/mpl"
          for pair in "SCITEX_DIR=$owned/scitex" "TMPDIR=$owned/tmp" "XDG_CACHE_HOME=$owned/cache" "XDG_CONFIG_HOME=$owned/config" "MPLCONFIGDIR=$owned/mpl" "MPLBACKEND=Agg" "PIP_CACHE_DIR=$owned/cache/pip" "UV_CACHE_DIR=$owned/cache/uv" "PYTHONPYCACHEPREFIX=$owned/cache/pycache" "RUN_E2E=1"; do
            printf '%s\n' "$pair" >> "${GITHUB_ENV:?}"
          done
      - uses: actions/checkout@v4
        with:
          # Full history is no longer needed for a --new-only diff (that flag
          # is gone — see the audit step), but it is kept deliberately rather
          # than pruned in the same change: narrowing checkout depth affects
          # the version check and any tag-reading step, and that is a separate
          # question from grandfathering. Change it on its own evidence.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and genuine public audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
          python -m pip install "scitex-dev[cli-audit]>=0.62.1"

      - name: Ensure Rust fd for audit discovery
        shell: bash
        run: |
          set -euo pipefail
          # Audits require Rust fd; keep existing fd/fdfind without global installs.
          if command -v fd >/dev/null 2>&1; then
            fd --version
            exit 0
          fi
          if command -v fdfind >/dev/null 2>&1; then
            fdfind --version
            exit 0
          fi
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            Linux:X64)
              target=x86_64-unknown-linux-musl
              digest=2b6bfaae8c48f12050813c2ffe1884c61ea26e750d803df9c9114550a314cd14
              ;;
            Linux:ARM64)
              target=aarch64-unknown-linux-musl
              digest=996b9b1366433b211cb3bbedba91c9dbce2431842144d925428ead0adf32020b
              ;;
            *)
              echo "::error::Rust fd is missing; no pinned bootstrap for ${RUNNER_OS}:${RUNNER_ARCH}."
              exit 1
              ;;
          esac
          # One directory per job invocation avoids shared toolcache races.
          tools=$(mktemp -d "${RUNNER_TEMP:?}/scitex-fd.XXXXXXXX")
          archive="$tools/fd.tar.gz"
          release="fd-v10.3.0-$target"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "https://github.com/sharkdp/fd/releases/download/v10.3.0/$release.tar.gz"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$tools" --strip-components=1 "$release/fd"
          "$tools/fd" --version
          printf '%s\n' "$tools" >> "${GITHUB_PATH:?}"

      - name: Run scitex-dev ecosystem audit-all (self-audit, own code)
        # NO --new-only AND NO --no-version-check, deliberately.
        #
        # This gate ran `--new-only --no-version-check` until 2026-08-16.
        # Both flags are named in the constitution §2 as the worked example
        # of a gate that cannot fail.
        #
        # What each one cost:
        #   --new-only          reports only violations newer than the base
        #                       ref, so anything already broken is
        #                       grandfathered permanently and invisibly.
        #                       "Drop the flag once the baseline has been
        #                       burned down" — the line this replaces — is a
        #                       comment, and a comment is not a mechanism.
        #                       Nothing measured the baseline, so nothing
        #                       ever triggered the drop.
        #   --no-version-check  suppresses the version-drift check outright.
        #
        # The removal is safe HERE and that was measured, not assumed:
        # `scitex-dev ecosystem audit-all figrecipe` (0.50.0, no flags) exits
        # 0 on this tree — 0 errors, 327 warnings. Warnings do not fail the
        # gate, so this repo's burndown is empty and the flags were hiding
        # nothing. That is specific to figrecipe: the same measurement puts
        # scitex-cards at 48 unmasked errors and scitex-writer at exit 1.
        #
        # If this gate goes red later, fix the finding or exempt it per file
        # with a written reason in `.scitex/dev/config.yaml` — reviewable,
        # greppable, individually retirable. An exemption is a decision
        # someone made and signed; --new-only is a decision nobody made
        # about violations nobody enumerated.
        run: scitex-dev ecosystem audit-all figrecipe
