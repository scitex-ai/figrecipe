name: quality

# Single-package quality gate — runs `scitex-dev ecosystem audit-all`
# against this package (audit-cli / audit-mcp-tools / audit-skills /
# audit-python-apis / audit-project). Mirrors the canonical audit that
# `tests/develop/test_audit.py` runs inside the test suite, but as a
# standalone gate so an audit regression is visible even when the matrix
# is skipped.
#
# The previous body of this workflow shallow-cloned the entire ecosystem
# and ran `scripts/quality/audit_ecosystem.py` — both of which live only
# in scitex-dev, not in leaf packages. That template was copied here
# verbatim and was always broken (FileNotFoundError on a non-existent
# ecosystem registry file). This version audits just this package.

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC, after the 07:00 per-repo Test runs
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/figrecipe-quality-audit-on-ubuntu-latest.yml"
  pull_request:
    branches: [main, develop]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is no longer needed for a --new-only diff (that flag
          # is gone — see the audit step), but it is kept deliberately rather
          # than pruned in the same change: narrowing checkout depth affects
          # the version check and any tag-reading step, and that is a separate
          # question from grandfathering. Change it on its own evidence.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Pin scitex-dev to a ref that includes the line-stable ViolationKey
          # fix (commit 96384b43, follow-up to PR #138's `audit-all --new-only`).
          # PyPI's latest tag (v0.17.13) was cut before that fix landed; until
          # the next release, install from develop. Drop this back to a PyPI
          # pin (`scitex-dev[cli-audit]>=0.17.14`) once tagged.
          pip install "scitex-dev[cli-audit] @ git+https://github.com/ywatanabe1989/scitex-dev@develop"

      - name: Install fd (Rust file finder; preferred fast path for audit discovery)
        run: |
          # scitex-dev's audit-project orphan-hinter prefers fd/fdfind for
          # file discovery. Absent fd it warns + falls back to a stdlib walk,
          # but this repo sets audit.require-fd: true (.scitex/dev/config.yaml)
          # so the audit ERRORS if fd is missing — install it here so the fast
          # path always runs. Debian/Ubuntu ships the binary as `fdfind`;
          # symlink it to `fd` so scitex-dev's `fd` lookup resolves too.
          sudo apt-get update && sudo apt-get install -y fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          fd --version

      - name: Run scitex-dev ecosystem audit-all (self-audit, own code)
        # NO --new-only AND NO --no-version-check, deliberately.
        #
        # This gate ran `--new-only --no-version-check` until 2026-08-16.
        # Both flags are named in the constitution §2 as the worked example
        # of a gate that cannot fail.
        #
        # What each one cost:
        #   --new-only          reports only violations newer than the base
        #                       ref, so anything already broken is
        #                       grandfathered permanently and invisibly.
        #                       "Drop the flag once the baseline has been
        #                       burned down" — the line this replaces — is a
        #                       comment, and a comment is not a mechanism.
        #                       Nothing measured the baseline, so nothing
        #                       ever triggered the drop.
        #   --no-version-check  suppresses the version-drift check outright.
        #
        # The removal is safe HERE and that was measured, not assumed:
        # `scitex-dev ecosystem audit-all figrecipe` (0.50.0, no flags) exits
        # 0 on this tree — 0 errors, 327 warnings. Warnings do not fail the
        # gate, so this repo's burndown is empty and the flags were hiding
        # nothing. That is specific to figrecipe: the same measurement puts
        # scitex-cards at 48 unmasked errors and scitex-writer at exit 1.
        #
        # If this gate goes red later, fix the finding or exempt it per file
        # with a written reason in `.scitex/dev/config.yaml` — reviewable,
        # greppable, individually retirable. An exemption is a decision
        # someone made and signed; --new-only is a decision nobody made
        # about violations nobody enumerated.
        run: scitex-dev ecosystem audit-all figrecipe
