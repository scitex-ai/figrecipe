name: ci

# ============================================================================
# CANONICAL scitex CI — thin org-reusable caller (the ONE per-repo shape).
# Rendered for figrecipe by `scitex-dev ecosystem ci-template apply`.
#
# Job bodies live ONCE, org-side, in scitex-ai/.github@main — a shared
# workflow cannot drift per-repo (operator decision, 2026-07-21, superseding
# the retired consolidated pr-ci.yml/release-ci.yml pair). This file carries
# only triggers, concurrency, and thin `uses:` calls.
#
# Pass the repo/org CI_RUNS_ON preference through each supported runs_on input.
# Shared runner admission selects the requested native group only for confirmed
# organization members; fork and untrusted events retain the hosted route.
# A missing preference uses the shared safe hosted default. Runner labels alone
# do not grant workflow admission to the native organization group.
#
# Required-status-check contexts (branch protection must reference these;
# under workflow_call GitHub renders "<caller-job-id> / <reusable job name>"):
#   pytest-matrix / pytest-matrix-on-ubuntu-py<X.YY>
#   import-smoke / import-smoke-on-ubuntu-py3-12
#   quality-audit / audit
#   rtd-sphinx-build / docs-sphinx
# ============================================================================

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *" # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; NEVER cancel post-merge/protected-branch runs
  # (preserves the retired release-ci.yml coalescing semantic).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-matrix:
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}
      pre_test_command: |
        owned=$(mktemp -d "${RUNNER_TEMP:?}/figrecipe-matrix-context.XXXXXXXX")
        mkdir -p "$owned/tmp" "$owned/cache" "$owned/config" "$owned/scitex" "$owned/mpl"
        for pair in "SCITEX_DIR=$owned/scitex" "TMPDIR=$owned/tmp" "XDG_CACHE_HOME=$owned/cache" "XDG_CONFIG_HOME=$owned/config" "MPLCONFIGDIR=$owned/mpl" "MPLBACKEND=Agg" "PIP_CACHE_DIR=$owned/cache/pip" "UV_CACHE_DIR=$owned/cache/uv" "PYTHONPYCACHEPREFIX=$owned/cache/pycache" "RUN_E2E=1"; do
          printf '%s\n' "$pair" >> "${GITHUB_ENV:?}"
        done
    secrets: inherit

  import-smoke:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}
      console_script: figrecipe
    secrets: inherit

  quality-audit:
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}
    secrets: inherit

  rtd-sphinx-build:
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@main
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}
    secrets: inherit
