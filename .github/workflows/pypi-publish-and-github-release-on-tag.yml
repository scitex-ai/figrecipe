name: release

# Tag-driven release pipeline — SELF-HOSTED via the CI SIF, destination set by
# the repo Actions Variable CI_RUNS_ON.
#
# THE FALLBACK IS `ubuntu-latest` AND THAT IS DELIBERATE. It used to be
# `["self-hosted","Linux","X64","scitex-ci"]` — a label carried only by the
# Spartan runners, all four of which were measured OFFLINE on 2026-08-15. An
# unset CI_RUNS_ON therefore queued a RELEASE against a label no online runner
# served: forever, silently, because GitHub queues an unmatchable job instead of
# rejecting it.
#
# This job cannot actually run on a hosted runner — exec-in-sif.sh requires an
# apptainer and the CI SIF, and says so as a hard error. So the fallback buys a
# FAST, LOUD failure instead of a hang. For a release that is the whole
# difference: a tag push that errors in a minute gets fixed, while a tag push
# that sits in "queued" looks like a slow queue on exactly the day someone is
# waiting for the artifact.
#
# The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest INSIDE the SIF. Must pass or the pipeline
#                      halts; nothing is published until tests are green on the
#                      tagged commit.
#   2. build         — after real tests and strict native frontend controls,
#                      wheel + sdist built INSIDE the SIF, uploaded as artifact.
#   3. publish       — PyPI via MANUAL OIDC trusted publishing INSIDE the SIF.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#   5. sync-main     — open a develop→main PR with a normal merge so main
#                      always equals the latest released commit. Skipped
#                      if main already matches.
#
# WHY the SIF (operator standardization 2026-06-18, fleet canary 2026-06-21):
# the Spartan compute runners have NO Python on the bare node, so the old
# `actions/setup-python@v5` step failed at init ("version 3.x not found for
# this OS"). The working pytest-matrix CI runs INSIDE the pre-built, reused
# scitex-ci SIF (`apptainer exec ci-cpu.sif`), which bakes python 3.11/3.12/
# 3.13 + pip + uv + fd at /opt/venv-<ver>. This release pipeline mirrors that:
#   - test/build run `bash .github/ci/exec-in-sif.sh <inner>.sh <pyver>`.
#   - publish CANNOT use pypa/gh-action-pypi-publish (a Docker action; the
#     compute nodes have no Docker), so it does MANUAL OIDC trusted publishing
#     inside the SIF (.github/ci/publish-in-sif.sh): GitHub OIDC JWT →
#     PyPI mint-token → twine upload. Trust config on PyPI is unchanged.
#   - actions/checkout, upload/download-artifact, codecov are JS actions and
#     run fine on the self-hosted runner.
# fail-loud: a missing SIF/shim/interpreter is a HARD error, never a
# bare-runner fallback.
#
# runs-on driven by repo Actions Variable CI_RUNS_ON; SIF + apptainer paths
# come from SCITEX_CI_SIF / SCITEX_CI_APPTAINER (same as pytest-matrix).
#
# Manual re-run: the workflow also accepts a `version` input via
# workflow_dispatch so you can re-publish without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

env:
  SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
  SCITEX_CI_SIF: ${{ vars.SCITEX_CI_SIF }}
  SCITEX_CI_SIF_SHA256: ${{ vars.SCITEX_CI_SIF_SHA256 }}
  RUN_E2E: "1"

jobs:
  runner-admission:
    uses: scitex-ai/.github/.github/workflows/runner-admission.yml@d7d96c34d68cdfbb5503a933591f7748b5aa30ee
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}
    permissions: {}

  frontend:
    name: frontend-build-on-ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve immutable release tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Prepare job-owned state and caches
        run: |
          set -euo pipefail
          owned=$(mktemp -d "${RUNNER_TEMP:?}/figrecipe-context.XXXXXXXX")
          mkdir -p "$owned/tmp" "$owned/cache" "$owned/config" "$owned/scitex" "$owned/mpl"
          for pair in "SCITEX_DIR=$owned/scitex" "TMPDIR=$owned/tmp" "XDG_CACHE_HOME=$owned/cache" "XDG_CONFIG_HOME=$owned/config" "MPLCONFIGDIR=$owned/mpl" "MPLBACKEND=Agg" "PIP_CACHE_DIR=$owned/cache/pip" "UV_CACHE_DIR=$owned/cache/uv" "PYTHONPYCACHEPREFIX=$owned/cache/pycache" "RUN_E2E=1"; do
            printf '%s\n' "$pair" >> "${GITHUB_ENV:?}"
          done
      - name: Check out figrecipe
        uses: actions/checkout@v4
        with:
          path: figrecipe
          ref: ${{ steps.ver.outputs.version }}
      - name: Check out the pinned canonical SDK owner
        uses: actions/checkout@v4
        with:
          repository: scitex-ai/scitex-sdk
          # Immutable library source genuinely published as scitex-sdk 0.3.0.
          ref: 9f5747a8ef5431e7412cdafa58f0dc0f3609a74d
          path: scitex-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Assert the checkout is the declared SDK source and version
        working-directory: figrecipe/src/figrecipe/_django/frontend
        env:
          SCITEX_SDK_DIR: ${{ github.workspace }}/scitex-sdk
        run: |
          set -euo pipefail
          declared_commit="$(node -p "require('./package.json').scitexSdk.commit")"
          declared_version="$(node -p "require('./package.json').scitexSdk.version")"
          actual_commit="$(git -C "$SCITEX_SDK_DIR" rev-parse HEAD)"
          owner_version="$(node -p "require(process.env.SCITEX_SDK_DIR + '/src/scitex_sdk/package.json').version")"
          test "$actual_commit" = "$declared_commit" || { echo "::error::SDK source pin mismatch"; exit 1; }
          test "$owner_version" = "$declared_version" || { echo "::error::SDK frontend version mismatch"; exit 1; }
      - name: Prepare job-owned npm configuration
        run: |
          touch "${TMPDIR:?}/npm-userconfig" "${TMPDIR:?}/npm-globalconfig"
          printf '%s\n' "npm_config_cache=${XDG_CACHE_HOME:?}/npm" "npm_config_logs_dir=${XDG_CACHE_HOME:?}/npm-logs" "npm_config_userconfig=${TMPDIR:?}/npm-userconfig" "npm_config_globalconfig=${TMPDIR:?}/npm-globalconfig" >> "${GITHUB_ENV:?}"
      - name: Install frontend deps
        working-directory: figrecipe/src/figrecipe/_django/frontend
        run: npm ci --no-audit --no-fund
      - name: Validate public exports, symbols, Python floor and lock
        working-directory: figrecipe/src/figrecipe/_django/frontend
        run: node --experimental-strip-types tests/scitexSdkContract.test.ts
      - name: Run the native frontend controls
        working-directory: figrecipe/src/figrecipe/_django/frontend
        run: |
          set -euo pipefail
          for test_file in tests/*.test.*; do
            node --experimental-strip-types "$test_file"
          done
      - name: Strict TypeScript and production build
        working-directory: figrecipe/src/figrecipe/_django/frontend
        run: npm run build
      - name: Strict library build
        working-directory: figrecipe/src/figrecipe/_django/frontend
        run: npm run build:lib

  test:
    needs: [runner-admission]
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - name: Require confirmed organization membership on native runners
        if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
        run: |
          echo '::error::Organization membership admission was not confirmed.'
          exit 1
      - name: Require admitted native execution for the retained CI SIF
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          NATIVE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != 'self-hosted' ] || [ "$NATIVE_AUTHORIZED" != 'true' ]; then
            echo '::error::The retained full SIF suite requires admitted native execution; no bare-runner or unqualified hosted fallback.'
            exit 1
          fi
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      # SIF-based self-hosted test run — mirrors pytest-matrix exactly. No
      # setup-python (the bare Spartan node has no Python tool cache; that step
      # failed "version not found for this OS"); no apt fd-install (fd is baked
      # in the SIF). exec-in-sif.sh apptainer-execs the reused ci-cpu.sif and
      # run-in-sif.sh layers THIS (tagged) checkout + [all,dev] into a writable
      # target, then runs pytest. fail-loud on a missing SIF/shim.
      - name: Require the retained whole CI image identity
        env:
          EXPECTED_SIF_SHA256: aa5836a6c317640d7e20f01eb79aa7385b3dca2f369b595065c50ba3dd34a7d5
        run: |
          set -euo pipefail
          if [ "${SCITEX_CI_SIF_SHA256:?}" != "$EXPECTED_SIF_SHA256" ]; then
            echo '::error::The CI image input differs from the retained qualified whole image; obtain owning image/runtime qualification before execution.'
            exit 1
          fi
      - name: Run tests in the reused CI SIF (apptainer exec — deps layered, not on the bare runner)
        run: bash .github/ci/exec-in-sif.sh run-in-sif.sh ${{ matrix.python-version }}

  build:
    needs: [runner-admission, test, frontend]
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - name: Require confirmed organization membership on native runners
        if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
        run: |
          echo '::error::Organization membership admission was not confirmed.'
          exit 1
      - name: Require admitted native execution for the retained CI SIF
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          NATIVE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != 'self-hosted' ] || [ "$NATIVE_AUTHORIZED" != 'true' ]; then
            echo '::error::The retained full SIF suite requires admitted native execution; no bare-runner or unqualified hosted fallback.'
            exit 1
          fi
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      # Build INSIDE the SIF (no setup-python on the bare Spartan node).
      # build-in-sif.sh installs the `build` frontend into a writable --target
      # inside the SIF, then `python -m build` → dist/. fail-loud on empty dist.
      - name: Require the retained whole CI image identity
        env:
          EXPECTED_SIF_SHA256: aa5836a6c317640d7e20f01eb79aa7385b3dca2f369b595065c50ba3dd34a7d5
        run: |
          set -euo pipefail
          if [ "${SCITEX_CI_SIF_SHA256:?}" != "$EXPECTED_SIF_SHA256" ]; then
            echo '::error::The CI image input differs from the retained qualified whole image; obtain owning image/runtime qualification before execution.'
            exit 1
          fi
      - name: Build wheel + sdist in the CI SIF (apptainer exec)
        run: bash .github/ci/exec-in-sif.sh build-in-sif.sh 3.12 ${{ steps.ver.outputs.version }}
      # upload-artifact is a JS action — runs fine on the self-hosted runner.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [runner-admission, build]
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    environment:
      name: pypi
      url: https://pypi.org/p/figrecipe
    # id-token: write is what populates ACTIONS_ID_TOKEN_REQUEST_{TOKEN,URL},
    # which publish-in-sif.sh uses to mint the OIDC JWT. Keep it.
    permissions:
      id-token: write
    steps:
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - name: Require confirmed organization membership on native runners
        if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
        run: |
          echo '::error::Organization membership admission was not confirmed.'
          exit 1
      - name: Require admitted native execution for the retained CI SIF
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          NATIVE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != 'self-hosted' ] || [ "$NATIVE_AUTHORIZED" != 'true' ]; then
            echo '::error::The retained full SIF suite requires admitted native execution; no bare-runner or unqualified hosted fallback.'
            exit 1
          fi
      # Need the repo checked out so .github/ci/exec-in-sif.sh +
      # publish-in-sif.sh are on disk (the build job uploaded only dist/).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Manual OIDC trusted publishing INSIDE the SIF — pypa/gh-action-pypi-
      # publish is a Docker action and the Spartan compute nodes have no Docker.
      # publish-in-sif.sh: GitHub OIDC JWT (audience=pypi) → PyPI mint-token →
      # twine upload dist/*. apptainer exec (no --cleanenv) passes the
      # ACTIONS_ID_TOKEN_REQUEST_* env vars into the SIF. fail-loud at each step.
      - name: Require the retained whole CI image identity
        env:
          EXPECTED_SIF_SHA256: aa5836a6c317640d7e20f01eb79aa7385b3dca2f369b595065c50ba3dd34a7d5
        run: |
          set -euo pipefail
          if [ "${SCITEX_CI_SIF_SHA256:?}" != "$EXPECTED_SIF_SHA256" ]; then
            echo '::error::The CI image input differs from the retained qualified whole image; obtain owning image/runtime qualification before execution.'
            exit 1
          fi
      - name: Publish to PyPI via manual OIDC trusted publishing in the SIF
        run: bash .github/ci/exec-in-sif.sh publish-in-sif.sh 3.12

  release:
    needs: [runner-admission, build, publish]
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    permissions:
      contents: write
    steps:
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - name: Require confirmed organization membership on native runners
        if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
        run: |
          echo '::error::Organization membership admission was not confirmed.'
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      # The `release` job runs on the self-hosted Spartan runner, where
      # $HOME=/home/ywatanabe is shared with the operator's account. `gh` loads
      # that account's machine-local config at startup, and there it ABORTS:
      #   failed to create root command: failed to read configuration:
      #   invalid config file /home/ywatanabe/.config/gh/config.yml: invalid yaml
      # That happens during config-load, BEFORE gh ever reads GH_TOKEN -- which
      # is why the token below (already the correct built-in one) never helped,
      # and why no PAT would help either. The cure is to stop depending on the
      # runner's `gh` at all: this JS action calls the GitHub Releases API
      # directly with the built-in per-run ${{ github.token }} that Actions
      # injects (the job already grants `permissions: contents: write`).
      # Same fix as scitex-ui#68 / scitex-writer / scitex-todo / scitex-dev /
      # scitex-agent-container (ci-gh-selfhosted-release-guard).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  sync-main:
    # Open develop→main PR so main always equals the latest released
    # commit. A normal protected merge leaves the PR open until gates pass.
    needs: [runner-admission, publish]
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - name: Require confirmed organization membership on native runners
        if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
        run: |
          echo '::error::Organization membership admission was not confirmed.'
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
      - name: Open develop→main PR if diverged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same self-hosted $HOME=/home/ywatanabe problem as the release job:
          # gh aborts while parsing the operator's machine-local
          # ~/.config/gh/config.yml ("invalid yaml") before it ever reads
          # GH_TOKEN. These are genuine gh-CLI operations (pr list/create/merge)
          # with no drop-in JS action, so rather than remove gh we point it at a
          # per-job config dir -- exactly as scitex-math#5 does for
          # GIT_CONFIG_GLOBAL. gh then starts clean and authenticates from the
          # built-in GH_TOKEN above. No PAT involved.
          GH_CONFIG_DIR: ${{ runner.temp }}/gh
        run: |
          set -e
          git fetch origin main
          AHEAD=$(git rev-list --count origin/main..origin/develop)
          if [ "$AHEAD" -eq 0 ]; then
            echo "main already up-to-date with develop."
            exit 0
          fi
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            PR_URL=$(gh pr create --base main --head develop \
              --title "release: sync main with develop" \
              --body "Auto-opened by the release pipeline so main equals the latest released commit.")
            EXISTING=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created PR #${EXISTING}"
          else
            echo "Reusing existing PR #${EXISTING}"
          fi
          gh pr merge "$EXISTING" --merge \
            || echo "Normal merge gates pending; PR left open for review."
