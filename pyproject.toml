[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figrecipe"
version = "0.34.2"
description = "Reproducible matplotlib wrapper with mm-precision layouts"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "matplotlib",
    "reproducibility",
    "visualization",
    "scientific",
    "plotting",
    "publication",
    "recipe",
    "yaml",
    "millimeter",
    "scitex",
    "figrecipe",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "PyYAML>=6.0.0",
    "ruamel.yaml>=0.17.0",
    "scipy>=1.7.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "scitex-app>=0.3.0",
    "scitex-config>=0.3.0",
    "scitex-dev>=0.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pre-commit>=3.5.0",
    "pyyaml>=6.0.0",
    "scitex-dev>=0.12.2",
    # Mirror runtime extras so `pip install -e .[dev]` runs the full suite.
    # Tests import these unguarded; PS210 audit invariants.
    "scitex-app>=0.3.0",
    "scitex-ui>=0.6.4",
    "scitex-logging",
    "scitex-pd",
    "scitex-stats",
    "scitex-types",
    "django>=4.2.0",
    "playwright>=1.40.0",
    "pytesseract>=0.3.0",
    "fastmcp>=2.0",
    # function-local test imports (`from PIL import Image` in
    # tests/figrecipe/_composition/test__compose.py et al; `import networkx as nx`
    # in tests/figrecipe/_serializer/test__utils.py); needed by `pip install -e .[dev]`.
    "Pillow>=9.0.0",
    "networkx>=3.0",
]
imaging = [
    "Pillow>=9.0.0",
]
seaborn = [
    "seaborn>=0.12.0",
    "pandas>=1.3.0",
]
scitex = [
    "scitex-app>=0.3.0",
    "scitex-ui>=0.6.4",
    "scitex-logging",
    "scitex-pd",
    "scitex-stats",
    "scitex-types",
]
editor = [
    "django>=4.2.0",
    "Pillow>=9.0.0",
]
app = [
    "django>=4.2.0",
    "Pillow>=9.0.0",
    "scitex-app>=0.3.0",
    "scitex-ui>=0.6.4",
]
desktop = [
    "django>=4.2.0",
    "Pillow>=9.0.0",
    "pywebview>=4.0.0",
    "qtpy>=2.0.0",
    "PyQt6>=6.0.0",
    "PyQt6-WebEngine>=6.0.0",
]
demo = [
    "playwright>=1.40.0",
    "pytesseract>=0.3.0",
]
graph = [
    "networkx>=3.0",
]
graph-interactive = [
    "networkx>=3.0",
    "pyvis>=0.3",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
mcp = [
    "fastmcp>=2.0",
]
all = [
    "figrecipe[dev,docs,graph-interactive,mcp,desktop]",
    "pyyaml>=6.0.0",
    "Pillow>=9.0.0",
    "seaborn>=0.12.0",
    "pandas>=1.3.0",
    "django>=4.2.0",
    "pywebview>=4.0.0",
    "playwright>=1.40.0",
    "pytesseract>=0.3.0",
]

[project.scripts]
figrecipe = "figrecipe._cli:main"

[project.entry-points."scitex_dev.docs"]
figrecipe = "figrecipe"

[project.entry-points."scitex_dev.skills"]
figrecipe = "figrecipe"

[project.entry-points."scitex_dev.linter.plugins"]
figure = "figrecipe._quality._linter_plugin:get_plugin"

[tool.scitex_dev]
mcp_parity_exempt = true

[tool.scitex_dev.audit]
# PS-168 (workflow-secret-env-prefix) — ONE name, exempted deliberately.
# Mirrors the same exemption on develop (#330); keep the two in step.
#
# `PERSONAL_ACCESS_TOKEN` is not a name figrecipe chose. The CLA action reads
# it from the environment under exactly that name, verified in source rather
# than in a README (scitex-ai/github-action, fork of
# contributor-assistant/github-action@v2.6.1, src/octokit.ts):
#
#     const personalAccessToken = process.env.PERSONAL_ACCESS_TOKEN as string
#
# That puts it in the same category as the `CODECOV_TOKEN` / `GHCR_PAT` /
# `NPM_TOKEN` entries already in PS-168's ecosystem default: a token whose
# name a third party dictates. PS-168 checks the `secrets.<NAME>` reference,
# and the only PAT secret this repo has is literally named
# `PERSONAL_ACCESS_TOKEN` (created 2026-03-11; repo secrets are
# `CLAUDE_CODE_CREDENTIALS_JSON` + `PERSONAL_ACCESS_TOKEN`, org secrets none).
#
# Worth stating plainly, because it is what let the bug survive an audit: the
# name this file now exempts is the one that EXISTS, while the name PS-168
# accepted without complaint until today (`GH_PERSONAL_ACCESS_TOKEN`) is the
# one that never existed. A naming rule cannot tell a real secret from an
# imaginary one — it grades the spelling, not the referent.
#
# Why not rename the secret to the prefixed form instead? GitHub secret VALUES
# are write-only — they cannot be read back — so re-creating this one as
# `FIGRECIPE_PERSONAL_ACCESS_TOKEN` needs the token value, which only the
# operator holds. Tracked as the root fix on card
# figrecipe-cla-pat-secret-name-unprefixed.
#
# Why not point the workflow at a prefixed name now? An absent secret
# interpolates to EMPTY rather than failing, and the action treats '' as
# absent, so a prefixed reference to a secret that does not exist silently
# re-breaks the CLA gate — the exact bug this branch fixes.
ps168_secret_exceptions = ["PERSONAL_ACCESS_TOKEN"]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/figrecipe"
Documentation = "https://figrecipe.readthedocs.io"
Repository = "https://github.com/ywatanabe1989/figrecipe.git"
Issues = "https://github.com/ywatanabe1989/figrecipe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/figrecipe"]
exclude = [
    "src/figrecipe/_django/frontend/node_modules",
    "src/figrecipe/_django/frontend/src",
    "src/figrecipe/_django/frontend/package*.json",
    "src/figrecipe/_django/frontend/tsconfig*.json",
    "src/figrecipe/_django/frontend/vite.config.ts",
    "src/figrecipe/_django/frontend/eslint.config.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["figrecipe"]
parallel = true
concurrency = ["multiprocessing", "thread"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/figrecipe/_cli/*",
    "*/figrecipe/_editor/*",
    "*/figrecipe/_dev/*",
    "*/figrecipe/_scitex_compat/*",
    "*/figrecipe/_mcp/*",
    "*/figrecipe/_django/*",
]

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/figrecipe/__init__.py" = ["E402", "F401"]
"src/figrecipe/_scitex_compat/_csv_formatters/__init__.py" = ["F401"]
"src/figrecipe/_scitex_compat/_csv_formatters/_export_as_csv.py" = ["E402"]
"src/figrecipe/_scitex_compat/_csv_formatters/*.py" = ["F841", "E722"]
